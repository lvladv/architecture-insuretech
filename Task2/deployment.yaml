apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: shestera/scaletestapp
        ports:
          - containerPort: 8080       
        resources:
          requests:
            cpu: "20m"
            memory: "30Mi"
          limits:
            cpu: "20m"
            memory: "30Mi"